<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>말랑 인형뽑기 · 위에서</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🧸%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(#ffd6e8,#c9e7ff);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none}
h1{margin:8px 0 2px;color:#e0457b;font-size:22px;text-shadow:2px 2px #fff}
#hud{display:flex;gap:12px;font-weight:bold;color:#444;margin-bottom:4px;font-size:14px}
#wrap{position:relative}
canvas{background:#fff8fc;border:8px solid #ff7aa8;border-radius:16px;max-width:96vw;touch-action:none}
#ctrl{display:flex;align-items:center;justify-content:center;gap:26px;margin:8px 0 4px}
#dpad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:44px 44px 44px;gap:4px}
#dpad button{font-size:18px;padding:0;margin:0}
#ub{grid-column:2;grid-row:1}
#lb{grid-column:1;grid-row:2}
#rb{grid-column:3;grid-row:2}
#db{grid-column:2;grid-row:3}
button{font-size:20px;font-weight:bold;border:none;border-radius:14px;padding:10px;background:#6aa9ff;color:#fff;box-shadow:0 4px #3d7fd6}
button:active{transform:translateY(3px);box-shadow:0 1px #3d7fd6}
#drop{background:#ff5c8a;box-shadow:0 4px #c93a63;width:90px;height:90px;border-radius:50%;font-size:18px;padding:0}
#ov{position:absolute;inset:0;background:rgba(255,255,255,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;text-align:center;padding:12px}
#ov h2{color:#e0457b;margin:6px}
#ov #sw{margin-top:10px;font-size:14px;font-weight:bold}
#ov #sw a,#alt a{color:#e0457b;text-decoration:none}
.hide{display:none!important}
#help{font-size:12px;color:#666;margin:2px 0 6px}
#alt{font-size:14px;margin:0 0 10px;font-weight:bold}
#alt a{padding:6px 12px;border:2px solid #ffb3c8;border-radius:12px;background:#fff}
</style></head><body>
<h1>🧸 말랑 인형뽑기 · 위에서</h1>
<div id="hud"><span>점수 <b id="sc">0</b></span><span>남은 기회 <b id="tr">4</b></span><span>시간 <b id="tm">15</b>초</span><span>최고 <b id="hi">0</b></span></div>
<div id="wrap"><canvas id="c" width="360" height="420"></canvas>
<div id="ov"><h2 id="ot">🧸 말랑 인형뽑기 · 위에서</h2><p id="om">집게를 인형 위에 올리고 집기!<br>모서리 출구 구멍까지 가져가면 점수예요.<br>말랑 친구 14종류 · ✨ 별똥이는 50점</p><button id="st">시작하기</button><p id="sw"><a href="../">→ 옆에서 보기</a></p></div></div>
<div id="ctrl">
  <div id="dpad">
    <button id="ub">▲</button>
    <button id="lb">◀</button>
    <button id="rb">▶</button>
    <button id="db">▼</button>
  </div>
  <button id="drop">집기!</button>
</div>
<div id="help">PC: 방향키 이동, 스페이스 집기 · 기회 4번, 한 번에 15초</div>
<div id="alt"><a href="../">→ 옆에서 보기</a></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),W=360,H=420,M=16;
const HOLE={x:40,y:H-34,r:28},N_DOLLS=18,P2=Math.PI*2;
const $=id=>document.getElementById(id);

function xf(px,py,rot,fn){x.save();x.translate(px,py);x.rotate(rot||0);fn();x.restore()}
function ell(cx,cy,rx,ry,rot,fill){x.save();x.translate(cx,cy);x.rotate(rot||0);x.beginPath();x.ellipse(0,0,rx,ry,0,0,P2);x.fillStyle=fill;x.fill();x.restore()}
function circ(cx,cy,r,fill){x.beginPath();x.arc(cx,cy,r,0,P2);x.fillStyle=fill;x.fill()}
function blush(s,ey){ell(-s*.34,ey+s*.14,s*.16,s*.09,0,'rgba(255,110,130,.42)');ell(s*.34,ey+s*.14,s*.16,s*.09,0,'rgba(255,110,130,.42)')}
function dots(s,ey){circ(-s*.2,ey,s*.11,'#3a2a28');circ(s*.2,ey,s*.11,'#3a2a28');circ(-s*.16,ey-s*.04,s*.04,'#fff');circ(s*.24,ey-s*.04,s*.04,'#fff')}
function smile(s,my){x.strokeStyle='#3a2a28';x.lineWidth=Math.max(1.2,s*.07);x.lineCap='round';x.beginPath();x.arc(0,my-s*.02,s*.1,.2,Math.PI-.2);x.stroke()}
function shine(s,ox,oy){ell(ox,oy,s*.28,s*.16,-.5,'rgba(255,255,255,.38)')}
function face(s){blush(s,s*.04);dots(s,-s*.04);smile(s,s*.22)}

function drawKong(px,py,s,rot){xf(px,py,rot,()=>{circ(0,0,s*.9,'#e8c49a');shine(s,-s*.2,-s*.15);face(s);ell(-s*.18,-s*.2,s*.28,s*.14,-.6,'#7cb342');ell(s*.2,-s*.18,s*.28,s*.14,.65,'#8bc34a')})}
function drawBear(px,py,s,rot){xf(px,py,rot,()=>{circ(-s*.58,-s*.5,s*.32,'#e8d09a');circ(s*.58,-s*.5,s*.32,'#e8d09a');circ(-s*.58,-s*.5,s*.16,'#f7e7c2');circ(s*.58,-s*.5,s*.16,'#f7e7c2');circ(0,s*.04,s*.88,'#f3e2b6');shine(s,-s*.2,-s*.15);face(s);ell(0,s*.08,s*.14,s*.1,0,'#6a4030')})}
function drawSom(px,py,s,rot){xf(px,py,rot,()=>{const p=[[0,0,.62,'#ffc4d6'],[-.55,.15,.46,'#ffb3c8'],[.55,.18,.48,'#ffd0de'],[-.2,.55,.44,'#ffb8cc'],[.25,.52,.4,'#ffc4d6'],[-.5,-.35,.42,'#ffd0de'],[.4,-.4,.44,'#ffc4d6'],[.05,-.58,.34,'#ffe0ea']];for(const[a,b,r,c]of p)circ(a*s,b*s,r*s,c);circ(0,s*.04,s*.46,'#ffe0ea');face(s)})}
function drawBee(px,py,s,rot){xf(px,py,rot,()=>{ell(-s*.75,0,s*.34,s*.22,0,'rgba(230,245,255,.9)');ell(s*.75,0,s*.34,s*.22,0,'rgba(230,245,255,.9)');circ(0,0,s*.8,'#ffd54a');x.save();x.beginPath();x.arc(0,0,s*.8,0,P2);x.clip();x.fillStyle='#3a2a28';x.fillRect(-s,-s*.22,s*2,s*.2);x.fillRect(-s,s*.16,s*2,s*.18);x.restore();shine(s,-s*.2,-s*.28);face(s);circ(-s*.22,-s*.85,s*.08,'#3a2a28');circ(s*.22,-s*.85,s*.08,'#3a2a28')})}
function drawRadish(px,py,s,rot){xf(px,py,rot,()=>{circ(0,s*.04,s*.86,'#f3e06a');shine(s,-s*.2,-s*.15);face(s);ell(-s*.22,-s*.55,s*.22,s*.12,-.5,'#6fbc4a');ell(0,-s*.62,s*.2,s*.14,0,'#5da83a');ell(s*.22,-s*.55,s*.22,s*.12,.5,'#7ec85a')})}
function drawDotori(px,py,s,rot){xf(px,py,rot,()=>{circ(0,s*.1,s*.78,'#c48a4a');circ(0,-s*.15,s*.72,'#7a4a22');ell(0,-s*.15,s*.72,s*.2,0,'#8b5a2b');ell(0,-s*.7,s*.1,s*.2,0,'#5a3318');shine(s,-s*.15,s*.15);blush(s,s*.2);dots(s,s*.14);smile(s,s*.38)})}
function drawPeng(px,py,s,rot){xf(px,py,rot,()=>{ell(-s*.78,s*.1,s*.28,s*.16,.3,'#e0c86a');ell(s*.78,s*.1,s*.28,s*.16,-.3,'#e0c86a');ell(0,0,s*.78,s*.86,0,'#f3e4a0');ell(0,s*.12,s*.4,s*.48,0,'#fff8e8');shine(s,-s*.18,-s*.22);blush(s,s*.06);dots(s,-s*.12);ell(0,s*.02,s*.14,s*.1,0,'#f0a030')})}
function drawHotteok(px,py,s,rot){xf(px,py,rot,()=>{circ(0,0,s*.95,'#a86a30');circ(0,0,s*.84,'#e0a050');circ(0,0,s*.66,'#f0bc6a');shine(s,-s*.2,-s*.15);for(const[a,b]of[[-.4,.1],[-.1,.3],[.32,.14],[.1,-.2],[-.28,-.12],[.4,-.08]])circ(a*s,b*s,s*.05,'#5a3010');face(s)})}
function drawBerry(px,py,s,rot){xf(px,py,rot,()=>{x.fillStyle='#e8576a';x.beginPath();x.moveTo(-s*.5,-s*.3);x.lineTo(-s*.28,-s*.8);x.lineTo(-s*.05,-s*.3);x.closePath();x.fill();x.beginPath();x.moveTo(s*.5,-s*.3);x.lineTo(s*.28,-s*.8);x.lineTo(s*.05,-s*.3);x.closePath();x.fill();circ(0,s*.06,s*.86,'#e8576a');for(const[a,b]of[[-.35,0],[-.1,.28],[.22,.1],[.36,.32],[-.28,.4],[.1,.5]])ell(a*s,b*s,s*.07,s*.1,a*.3,'#ffe08a');shine(s,-s*.2,-s*.05);face(s);ell(0,-s*.72,s*.16,s*.28,0,'#5da83a');ell(-s*.26,-s*.62,s*.18,s*.24,-.5,'#6fbc4a');ell(s*.26,-s*.62,s*.18,s*.24,.5,'#4e9a32')})}
function drawChestnut(px,py,s,rot){xf(px,py,rot,()=>{x.fillStyle='#5a8a32';for(let i=0;i<12;i++){const a=i*P2/12;x.beginPath();x.moveTo(Math.cos(a-0.18)*s*.55,Math.sin(a-0.18)*s*.55);x.lineTo(Math.cos(a)*s*1.08,Math.sin(a)*s*1.08);x.lineTo(Math.cos(a+0.18)*s*.55,Math.sin(a+0.18)*s*.55);x.closePath();x.fill()}circ(0,0,s*.7,'#6b3a18');circ(0,0,s*.52,'#8a5228');shine(s,-s*.18,-s*.12);face(s)})}
function drawFrog(px,py,s,rot){xf(px,py,rot,()=>{circ(0,s*.08,s*.8,'#8fd9b8');ell(0,s*.2,s*.42,s*.36,0,'#e8f8ef');function eye(ex,ey){circ(ex,ey,s*.32,'#6fc9a4');circ(ex,ey,s*.24,'#fff');circ(ex,ey,s*.12,'#2a2a2a');circ(ex-s*.05,ey-s*.05,s*.05,'#fff')}eye(-s*.32,-s*.42);eye(s*.32,-s*.42);blush(s,s*.14);smile(s,s*.32)})}
function spark(ox,oy,r,fill){x.beginPath();for(let i=0;i<8;i++){const a=-Math.PI/2+i*Math.PI/4,rad=i%2===0?r:r*.32,px=ox+Math.cos(a)*rad,py=oy+Math.sin(a)*rad;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle=fill;x.fill()}
function drawStar(px,py,s,rot){xf(px,py,rot,()=>{circ(0,0,s,'rgba(255,220,80,.28)');x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2===0?s*1.02:s*.46,px=Math.cos(a)*rad,py=Math.sin(a)*rad;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fillStyle='#ffd24a';x.fill();x.strokeStyle='#e8a800';x.lineJoin='round';x.lineWidth=Math.max(1,s*.06);x.stroke();circ(0,0,s*.4,'#ffe89a');face(s);spark(s*.72,-s*.72,s*.26,'#fff8d0')})}
function drawWhale(px,py,s,rot){xf(px,py,rot,()=>{ell(s*.8,s*.2,s*.32,s*.16,-.2,'#7eb8e8');ell(s*.7,s*.4,s*.26,s*.14,.5,'#7eb8e8');ell(-s*.7,s*.25,s*.26,s*.13,.4,'#7eb8e8');circ(0,0,s*.8,'#9ad0f5');ell(0,s*.12,s*.42,s*.36,0,'#e8f6ff');shine(s,-s*.18,-s*.15);face(s);circ(0,-s*.15,s*.16,'#e6f5ff');circ(-s*.16,-s*.12,s*.11,'#ccecff');circ(s*.16,-s*.12,s*.11,'#ccecff');circ(0,-s*.3,s*.09,'#fff')})}
function drawMoon(px,py,s,rot){xf(px,py,rot,()=>{ell(-s*.42,-s*.62,s*.2,s*.28,.25,'#cbb6ea');ell(s*.42,-s*.62,s*.2,s*.28,-.25,'#cbb6ea');ell(-s*.42,-s*.62,s*.1,s*.15,.25,'#e8d8fa');ell(s*.42,-s*.62,s*.1,s*.15,-.25,'#e8d8fa');circ(0,s*.04,s*.86,'#d5c4f0');shine(s,-s*.2,-s*.15);x.fillStyle='#f0d878';x.beginPath();x.arc(-s*.26,-s*.12,s*.2,-.6,2.4,false);x.arc(-s*.18,-s*.16,s*.14,2.5,-.7,true);x.closePath();x.fill();face(s)})}

const TYPES=[
  {n:'콩떡이',p:10,c:'#e8c49a',g:.75,draw:drawKong},
  {n:'말랑곰',p:10,c:'#f3e2b6',g:.75,draw:drawBear},
  {n:'솜솜이',p:15,c:'#ffb3c8',g:.65,draw:drawSom},
  {n:'꿀벌콩',p:15,c:'#ffd54a',g:.65,draw:drawBee},
  {n:'단무다',p:15,c:'#f3e06a',g:.65,draw:drawRadish},
  {n:'도토리',p:20,c:'#c48a4a',g:.55,draw:drawDotori},
  {n:'감자펭',p:20,c:'#f3e4a0',g:.55,draw:drawPeng},
  {n:'호떡포',p:20,c:'#e0a050',g:.55,draw:drawHotteok},
  {n:'딸기냥',p:25,c:'#e8576a',g:.5,draw:drawBerry},
  {n:'밤송이',p:25,c:'#6b3a18',g:.5,draw:drawChestnut},
  {n:'개굴몽',p:30,c:'#8fd9b8',g:.45,draw:drawFrog},
  {n:'구름고래',p:35,c:'#9ad0f5',g:.4,draw:drawWhale},
  {n:'달마우',p:40,c:'#d5c4f0',g:.35,draw:drawMoon},
  {n:'별똥이',p:50,c:'#ffd700',g:.3,draw:drawStar,rare:true}
];
let dolls,score,tries,time,state,claw,keys={},hi=+localStorage.clawHiTop||0,timer,msg='',msgT=0;
$('hi').textContent=hi;
function pickType(){if(Math.random()<.07)return TYPES.find(t=>t.rare);const pool=TYPES.filter(t=>!t.rare);return pool[Math.floor(Math.random()*pool.length)]}
function newDolls(){
  dolls=[];
  for(let i=0;i<N_DOLLS;i++){
    let px,py,ok,g=0;
    do{
      px=M+30+Math.random()*(W-M*2-60);
      py=M+30+Math.random()*(H-M*2-60);
      ok=Math.hypot(px-HOLE.x,py-HOLE.y)>HOLE.r+34;
      if(ok) for(const d of dolls) if(Math.hypot(px-d.x,py-d.y)<38) ok=false;
    }while(!ok && ++g<50);
    dolls.push({t:pickType(),x:px,y:py,r:21,held:false,rot:(Math.random()-.5)*.5,sr:21});
  }
}
function reset(){score=0;tries=4;newDolls();startTry();state='move';$('ov').classList.add('hide');upd()}
function startTry(){claw={x:W/2,y:H/2-20,open:1,held:null,h:1};time=15;state='move';clearInterval(timer);timer=setInterval(()=>{if(state=='move'){time--;if(time<=0)drop()}upd()},1000)}
function upd(){$('sc').textContent=score;$('tr').textContent=tries;$('tm').textContent=Math.max(0,time)}
function drop(){if(state!='move')return;state='down'}
function say(m){msg=m;msgT=70}
function canSteer(){return state=='move'||state=='carry'}
function steer(){
  if(!canSteer())return;
  const sp=3;
  if(keys.l)claw.x-=sp;if(keys.r)claw.x+=sp;if(keys.u)claw.y-=sp;if(keys.d)claw.y+=sp;
  claw.x=Math.max(M+18,Math.min(W-M-18,claw.x));
  claw.y=Math.max(M+18,Math.min(H-M-18,claw.y));
}
function hitDoll(){let best=null,bd=24;for(const d of dolls){if(d.held||d.win)continue;const dist=Math.hypot(d.x-claw.x,d.y-claw.y);if(dist<bd+d.r*.25){bd=dist;best=d}}return best}
function overHole(){return Math.hypot(claw.x-HOLE.x,claw.y-HOLE.y)<HOLE.r-2}
function step(){
  steer();
  if(state=='down'){claw.h=Math.max(0,claw.h-.05);if(claw.h<=0){claw.h=0;state='grab';claw.cand=hitDoll();claw.wait=18}}
  else if(state=='grab'){claw.open=Math.max(0,claw.open-.08);if(--claw.wait<=0){let d=claw.cand;if(d&&Math.random()<d.t.g){d.held=true;claw.held=d}state='up'}}
  else if(state=='up'){claw.h=Math.min(1,claw.h+.05);if(claw.held&&claw.h>.35&&Math.random()<.004)drp('앗! 떨어졌어요 😢');if(claw.h>=1){claw.h=1;state=claw.held?'carry':'end';if(claw.held)say('출구로 가져가세요!')}}
  else if(state=='carry'){if(claw.held&&Math.random()<.0025)drp('앗! 떨어졌어요 😢');else if(claw.held&&overHole())state='release'}
  else if(state=='release'){if(claw.held){let d=claw.held;d.held=false;d.win=true;d.vx=0;d.vy=0;claw.held=null}claw.open=Math.min(1,claw.open+.08);if(claw.open>=1)state='end'}
  else if(state=='end'){claw.open=1;claw.h=1;endTry()}
  if(claw.held){claw.held.x=claw.x;claw.held.y=claw.y}
  for(const d of dolls){
    if(d.held||!d.win)continue;
    d.x+=(HOLE.x-d.x)*.16;d.y+=(HOLE.y-d.y)*.16;d.r*=.9;
    if(d.r<4){score+=d.t.p;say('+'+d.t.p+' '+d.t.n);d.dead=true;upd()}
  }
  dolls=dolls.filter(d=>!d.dead);
}
function drp(m){let d=claw.held;d.held=false;claw.held=null;d.r=d.sr||21;say(m);state='end'}
function endTry(){if(state=='over')return;tries--;upd();if(dolls.filter(d=>!d.win).length<5){newDolls();say('인형 리필! 🎁')}
 if(tries<=0){state='over';clearInterval(timer);setTimeout(gameOver,900)}else startTry()}
function gameOver(){if(score>hi){hi=score;localStorage.clawHiTop=hi;$('hi').textContent=hi}$('ot').textContent='게임 오버!';$('om').innerHTML='최종 점수 <b>'+score+'</b>점<br>최고 점수 '+hi+'점';$('st').textContent='다시 하기';$('ov').classList.remove('hide')}
function drawHole(){
  x.fillStyle='#2a2a30';x.beginPath();x.arc(HOLE.x,HOLE.y,HOLE.r,0,P2);x.fill();
  x.fillStyle='#1a1a20';x.beginPath();x.arc(HOLE.x,HOLE.y,HOLE.r-7,0,P2);x.fill();
  x.fillStyle='#fff';x.font='bold 11px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('출구',HOLE.x,HOLE.y);
}
function drawClaw(){
  const {x:cx,y:cy,h,open}=claw;
  const sh=12+h*22;
  x.fillStyle='rgba(50,30,40,'+(0.14+h*0.2)+')';
  x.beginPath();x.ellipse(cx+h*5,cy+h*6,sh,sh*.7,0,0,P2);x.fill();
  if(state=='move'||state=='carry'){
    x.strokeStyle='rgba(80,80,90,.28)';x.lineWidth=2;
    x.beginPath();x.arc(cx,cy,20,0,P2);x.stroke();
  }
  const sc=.8+h*.28;
  x.save();x.translate(cx,cy);x.scale(sc,sc);
  circ(0,0,10,'#7a8088');circ(0,0,6,'#c5c8cc');
  x.strokeStyle='#555';x.lineWidth=4;x.lineCap='round';
  const o=8+open*10;
  for(const a of [-Math.PI/2,-Math.PI/2+2.15,-Math.PI/2-2.15]){
    x.beginPath();x.moveTo(Math.cos(a)*5,Math.sin(a)*5);x.lineTo(Math.cos(a)*o,Math.sin(a)*o);x.stroke();
  }
  x.restore();
}
function draw(){
  x.clearRect(0,0,W,H);
  x.fillStyle='#fce8f2';x.fillRect(0,0,W,H);
  x.strokeStyle='#ffb3c8';x.lineWidth=10;x.strokeRect(5,5,W-10,H-10);
  drawHole();
  const floor=dolls.filter(d=>!d.held).slice().sort((a,b)=>(a.win?1:0)-(b.win?1:0));
  for(const d of floor){
    if(!d.win){x.fillStyle='rgba(80,40,50,.14)';x.beginPath();x.ellipse(d.x+3,d.y+4,d.r*.72,d.r*.5,0,0,P2);x.fill()}
    d.t.draw(d.x,d.y,d.r,d.rot||0);
  }
  if(claw.held){
    const d=claw.held,sc=.8+claw.h*.28,rs=d.sr*sc;
    x.fillStyle='rgba(80,40,50,'+(0.12+claw.h*.15)+')';
    x.beginPath();x.ellipse(d.x+claw.h*5,d.y+claw.h*6,rs*.8,rs*.55,0,0,P2);x.fill();
    d.t.draw(d.x,d.y,rs,d.rot||0);
  }
  drawClaw();
  if(msgT>0){msgT--;x.fillStyle='rgba(224,69,123,.9)';x.font='bold 20px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(msg,W/2,H/2-20)}
}
function loop(){if(state&&state!='over'||msgT>0)step();draw();requestAnimationFrame(loop)}
claw={x:W/2,y:H/2-20,open:1,h:1};newDolls();state=null;loop();
$('st').onclick=reset;
const hold=(id,k)=>{const b=$(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>keys[k]=0};
hold('lb','l');hold('rb','r');hold('ub','u');hold('db','d');
$('drop').onclick=drop;
onkeydown=e=>{
  if(e.key=='ArrowLeft')keys.l=1;if(e.key=='ArrowRight')keys.r=1;
  if(e.key=='ArrowUp'){e.preventDefault();keys.u=1}if(e.key=='ArrowDown'){e.preventDefault();keys.d=1}
  if(e.key==' '){e.preventDefault();state?drop():reset()}
};
onkeyup=e=>{
  if(e.key=='ArrowLeft')keys.l=0;if(e.key=='ArrowRight')keys.r=0;
  if(e.key=='ArrowUp')keys.u=0;if(e.key=='ArrowDown')keys.d=0;
};
</script></body></html>
